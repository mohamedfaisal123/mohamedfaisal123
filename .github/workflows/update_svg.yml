name: Update GitHub Stats

on:
  # Run every day at midnight UTC
  schedule:
    - cron: '0 0 * * *'
  
  # Allow manual trigger
  workflow_dispatch:
  
  # Run on push to main branch
  push:
    branches:
      - main
    paths:
      - 'generate_svg.py'

jobs:
  update-stats:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: 🐍 Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests
      
      - name: 🔧 Generate Stats SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python generate_svg.py
      
      - name: 🔍 Check for Changes
        id: verify-changed-files
        run: |
          if git diff --quiet stats.svg; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi
      
      - name: 💾 Commit and Push Changes
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add stats.svg
          git commit -m "🔄 Update GitHub statistics [automated]"
          git push
      
      - name: ✅ Success Message
        if: steps.verify-changed-files.outputs.changed == 'true'
        run: |
          echo "✅ GitHub statistics updated successfully!"
      
      - name: ℹ️ No Changes
        if: steps.verify-changed-files.outputs.changed == 'false'
        run: |
          echo "ℹ️  No changes detected in statistics"
